<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Speaking Practice｜雅思口說練習</title>
<meta name="description" content="IELTS 口說 Part 2、Part 3 練習：不重複題庫、即時逐字稿、每題的思考角度與加分詞彙，以及通用的表達工具箱。">
<meta name="theme-color" content="#3447c9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233447c9'/%3E%3Cpath d='M9 12a7 7 0 0 1 14 0v3a7 7 0 0 1-14 0z' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M16 22v4m-4 0h8' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ec; --surface:#ffffff; --surface2:#faf9f5; --ink:#1b2130; --muted:#636b7d; --line:#e2dfd5;
  --accent:#3447c9; --accent-ink:#ffffff; --accent-soft:#e6e9fb;
  --good:#0c7a5c; --good-bg:#d6f1e6; --tool:#3447c9; --tool-bg:#e3e7ff;
  --warn:#a85a06; --warn-bg:#fcebc9; --bad:#c0362c; --bad-bg:#fde3e0;
  --shadow:0 1px 2px rgba(27,33,48,.05),0 8px 24px rgba(27,33,48,.06);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif TC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10131a; --surface:#191e29; --surface2:#151a24; --ink:#e7e9ef; --muted:#98a1b4; --line:#2a3141;
    --accent:#8fa0ff; --accent-ink:#0d1020; --accent-soft:#222a52;
    --good:#5fd3ae; --good-bg:#143a30; --tool:#a9b6ff; --tool-bg:#262f5f;
    --warn:#f0b35a; --warn-bg:#3f2f10; --bad:#ff9087; --bad-bg:#46201c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65}
[lang=en]{font-family:var(--serif)}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding-left:1.2em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font-weight:700;letter-spacing:.01em}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:14px;font-family:var(--serif)}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:7px 12px;border-radius:999px;color:var(--muted);font-size:14.5px}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}

.wrap{max-width:820px;margin:0 auto;padding:24px 16px 120px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fine{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:16px}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:10px;font-weight:600;font-size:15px;transition:transform .08s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn.big{padding:14px 28px;font-size:17px}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.stop:hover{background:var(--bad);filter:brightness(1.08)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* home */
.hero{padding:22px 0 8px}
.hero h1{font-size:clamp(26px,5vw,36px);line-height:1.25;margin:10px 0 10px;letter-spacing:-.01em}
.hero .lead{color:var(--muted);font-size:17px;max-width:34em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode h2{font-size:19px;line-height:1.35}
.mode p{color:var(--muted);font-size:14.5px;flex:1}
.mode .go{color:var(--accent);font-weight:700;margin-top:6px}
.mode .pill{align-self:flex-start}
.banner{border-radius:12px;padding:12px 16px;font-size:14.5px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.banner.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.prog{display:grid;gap:12px}
.prog-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;font-size:14px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px}
.steps li:before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px}
h3.sec{font-size:15px;margin-bottom:12px}

/* practice */
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.cue{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:14px;padding:20px 22px 22px;box-shadow:var(--shadow)}
.cue header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cue h2{font-size:clamp(20px,3.6vw,25px);line-height:1.35;font-weight:600}
.cue .say{margin:14px 0 6px;color:var(--muted);font-family:var(--serif);font-style:italic}
.cue ul{font-size:17px;display:grid;gap:3px}
.cue.compact{padding:14px 18px 16px;border-top-width:3px}
.cue.compact h2{font-size:18px}
.cue.compact ul{font-size:15px}
.cue.compact .say{margin:8px 0 4px;font-size:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow)}
.qcard h2{font-size:clamp(19px,3.4vw,24px);line-height:1.4;font-weight:600;margin-top:8px}
.qcard .from{margin-top:10px;font-size:13px;color:var(--muted)}

.timer-box{text-align:center;padding:10px 0 4px}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(44px,11vw,68px);font-weight:600;letter-spacing:-.02em;line-height:1}
.timer.warn{color:var(--warn)}
.timer-sub{color:var(--muted);font-size:14px;margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s linear}
.bar.warn i{background:var(--warn)}
.rec-line{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);min-height:24px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}.mode,.btn,.bar i{transition:none}}
.live{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:150px;max-height:300px;overflow:auto;font-family:var(--serif);font-size:18px;line-height:1.7}
.live .ph{color:var(--muted);font-family:var(--sans);font-size:15px}
.live .int{color:var(--muted)}
textarea{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;line-height:1.6}
textarea.en{font-family:var(--serif);font-size:17px}
.notes-view{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px;white-space:pre-wrap}
.notes-view b{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}

/* result */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}
.stat em{display:block;font-style:normal;font-size:12px;margin-top:2px;color:var(--muted)}
.stat em.ok{color:var(--good)} .stat em.warn{color:var(--warn)}
.tscript{font-family:var(--serif);font-size:18px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.tscript.empty{font-family:var(--sans);font-size:15px;color:var(--muted)}
.m-vocab{background:var(--good-bg);color:var(--good);border-radius:4px;padding:1px 3px;font-weight:600}
.m-tool{background:var(--tool-bg);color:var(--tool);border-radius:4px;padding:1px 3px;font-weight:600}
.m-filler{text-decoration:underline wavy var(--bad);text-underline-offset:4px;color:var(--bad)}
.m-soft{text-decoration:underline dotted var(--warn);text-decoration-thickness:2px;text-underline-offset:4px}
.m-shallow{border-bottom:2px dashed var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.legend span{font-family:var(--sans);font-weight:500}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.card-h h3{font-size:15px}
.card-h .count{font-family:var(--mono);font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--serif);font-size:15px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface2)}
.chip.on{background:var(--good-bg);border-color:transparent;color:var(--good);font-weight:600}
.chip.tool{background:var(--tool-bg);border-color:transparent;color:var(--tool);font-weight:600}
.shrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.card-h+.shrow{border-top:0;padding-top:2px}
.shrow .w{font-family:var(--serif);font-size:17px;font-weight:600}
.shrow .w small{font-family:var(--mono);font-size:13px;color:var(--warn);margin-left:6px;font-weight:600}
.shrow .alts{font-size:14.5px;color:var(--muted)}
.shrow .alts b{font-family:var(--serif);color:var(--ink);font-weight:600}

/* hints */
details.hint,details.tcat,details.hist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"＋";color:var(--muted);font-weight:400;flex:none}
details[open]>summary:after{content:"－"}
details>summary small{font-weight:400;color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.hint-body,.tbody{padding:2px 18px 18px;border-top:1px solid var(--line)}
.hint-body h4{font-size:12.5px;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px}
.hint-body ul{display:grid;gap:5px;font-size:15px}
.hint-body p{font-size:15px}
.starters{list-style:none;padding:0}
.starters li{font-size:16.5px;padding:6px 12px;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.vlist{display:grid}
.vrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow b{font-size:17px}
.vrow .pos{font-size:12.5px;color:var(--muted);font-style:italic;margin:0 6px 0 4px;font-family:var(--serif)}
.vrow .zh{font-size:14.5px}
.vrow .ex{color:var(--muted);font-size:15px;line-height:1.5;margin-top:1px}
.vrow .src{font-size:12px;color:var(--muted);margin-top:3px}
.star{background:none;border:0;font-size:20px;line-height:1;padding:6px;color:var(--muted);border-radius:8px}
.star:hover{background:var(--surface2)}
.star.on{color:#e0a100}
.tcat summary{flex-wrap:wrap}
.tcat summary b{font-size:16px}
.weak{font-size:14px;color:var(--muted);margin:12px 0 2px}
.weak span{font-family:var(--serif);text-decoration:line-through;margin-right:8px;color:var(--bad)}
.tip{font-size:14px;background:var(--warn-bg);border-radius:10px;padding:10px 14px;margin-top:10px}
.guide h3{font-size:17px;margin-bottom:10px}
.guide ul{display:grid;gap:8px;font-size:15px}
.guide .demo{font-family:var(--serif);font-size:16.5px;background:var(--surface2);border-radius:10px;padding:12px 14px;margin-top:10px;line-height:1.75}
.guide .demo mark{background:var(--accent-soft);color:var(--accent);font-family:var(--sans);font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin:0 2px;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14.5px;margin-top:4px}
.flow span{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:8px;font-weight:600}
.flow i{color:var(--muted);font-style:normal}

/* drawer */
.fab{position:fixed;right:16px;bottom:20px;z-index:25;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:17px}
.drawer-b{overflow:auto;padding:14px 14px 40px;display:grid;gap:10px;align-content:start}

/* vocab + history */
.tools-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools-row input[type=search]{flex:1;min-width:180px;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.hide-zh .zh{background:var(--line);color:transparent;border-radius:4px;cursor:pointer;user-select:none}
.hide-zh .zh.show{background:none;color:inherit}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.hist summary .meta{font-weight:400;font-size:13px;color:var(--muted);display:block}
.hist summary .ttl{font-family:var(--serif);font-size:16.5px;display:block;line-height:1.4}
.hist-body{padding:4px 18px 18px;border-top:1px solid var(--line);display:grid;gap:16px}
.hitem h4{font-family:var(--serif);font-size:16px;font-weight:600;margin:12px 0 4px}
.hitem .mini{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sumrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.sumrow:first-of-type{border-top:0}
.sumrow .qq{font-family:var(--serif);font-size:16px}
.sumrow .nums{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:640px){
  .wrap{padding:18px 16px 150px}
  .top{backdrop-filter:none;background:var(--bg)}
  .top-in{padding:8px 16px}
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .nav button{flex:1;padding:9px 4px;border-radius:10px;font-size:14px}
  .modes{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .fab{bottom:calc(70px + env(safe-area-inset-bottom))}
  #toast{bottom:136px}
  .actions .btn{flex:1 1 auto}
  details>summary small{display:none}
  .shrow{grid-template-columns:1fr auto}
  .shrow .alts{grid-column:1/-1;grid-row:2}
  .sumrow{grid-template-columns:1fr}
  .sumrow .nums{text-align:left}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" data-act="nav" data-to="home" aria-label="回首頁"><i>S</i><span>IELTS Speaking Practice</span></button>
  <nav class="nav" aria-label="主選單">
    <button data-act="nav" data-to="home">練習</button>
    <button data-act="nav" data-to="toolbox">工具箱</button>
    <button data-act="nav" data-to="vocab">單字本</button>
    <button data-act="nav" data-to="history">歷史</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<button class="fab" id="fab" data-act="tool" hidden>表達工具箱</button>
<div class="scrim" id="scrim" data-act="closeDrawer" hidden></div>
<aside class="drawer" id="drawer" aria-label="表達工具箱" hidden>
  <div class="drawer-h"><h2>表達工具箱</h2><button class="btn sm" data-act="closeDrawer">關閉</button></div>
  <div class="drawer-b" id="drawerBody"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">這個網頁需要開啟 JavaScript 才能使用。</p></noscript>
<script>
'use strict';
/* ================= 題庫：40 張 Part 2 題卡，每張 4 題 Part 3 =================
   欄位：t 題目、p 要點、a 思考角度、d 加深度的技巧、v 加分詞彙 [詞, 詞性, 中文, 例句]、s 參考開頭、q 延伸的 Part 3 */
const BANK = [];
BANK.push(
{id:"c01",cat:"person",t:"Describe a person who has influenced you.",
 p:["who this person is","how you know them","what they have done","and explain how they have influenced you."],
 a:["挑一個具體事件，而不是只列形容詞：他在某個時刻做了什麼、說了什麼。","講「之前的我」和「之後的我」：這個人改變了你哪個習慣或想法。","承認複雜面：也許當時你不認同，後來才懂。"],
 d:"不要停在 She is kind and hard-working。往下一層：Her attitude made me realize that…，把人物特質連到你自己的改變。",
 v:[["role model","n.","榜樣","She has been a real role model for me ever since high school."],
    ["look up to","phr. v.","敬重、仰慕","I've always looked up to my uncle because of the way he treats people."],
    ["have a profound impact on","phr.","對…有深遠影響","Her advice had a profound impact on the way I deal with failure."],
    ["shape who I am","phr.","塑造了我這個人","Those conversations really shaped who I am today."],
    ["lead by example","phr.","以身作則","He never lectured us; he simply led by example."],
    ["down-to-earth","adj.","務實、沒有架子","Despite her success, she's incredibly down-to-earth."]],
 s:["The person who immediately springs to mind is…","What I admire most about her is not what she achieved, but how she…"],
 q:[{t:"What kind of people tend to influence young people the most nowadays?",
     a:["比較父母老師與網紅名人：影響的方式不同，一個是日常相處，一個是螢幕上的形象。"],
     v:[["peer pressure","n.","同儕壓力","Peer pressure plays a huge role during the teenage years."],["influencer","n.","網紅","A lot of teenagers model themselves on an influencer they follow."],["impressionable","adj.","易受影響的","Kids at that age are very impressionable."]],
     s:"I'd say it has shifted quite a bit over the last decade or so…"},
    {t:"Do you think parents or teachers have more influence on children?",
     a:["用「階段」回答：幼年是父母，青春期老師與同儕比重上升。避免硬選一邊。"],
     v:[["formative years","n.","性格形成的關鍵時期","Parents matter most during a child's formative years."],["instill values","phr.","灌輸價值觀","Parents instill values long before a child starts school."],["authority figure","n.","權威人物","Teachers are often the first authority figures outside the family."]],
     s:"It really depends on the stage of life we're talking about…"},
    {t:"Can famous people be good role models?",
     a:["兩面都講：名人有能見度可以帶動好行為，但我們看到的是包裝過的形象。各舉一例。"],
     v:[["in the public eye","phr.","在公眾目光下","People in the public eye are watched all the time."],["set a good example","phr.","樹立好榜樣","Athletes can set a good example by staying humble."],["carefully curated","adj.","精心包裝過的","What we see online is a carefully curated image."]],
     s:"To some extent, yes, although I'd be a bit cautious about…"},
    {t:"How has technology changed the way people influence each other?",
     a:["過去和現在對比：影響力從身邊的人擴大到素未謀面的人，速度更快但也更表面。"],
     v:[["go viral","phr.","爆紅","A single video can go viral overnight and change how people think."],["word of mouth","n.","口耳相傳","In the past, ideas spread mainly by word of mouth."],["echo chamber","n.","同溫層","Algorithms can trap people in an echo chamber."]],
     s:"Compared with my parents' generation, the biggest difference is…"}]},

{id:"c02",cat:"person",t:"Describe an older person you admire.",
 p:["who this person is","how you know them","what they are like","and explain why you admire them."],
 a:["講他經歷過的時代或困難，以及他怎麼面對，這比「他很慈祥」有深度。","對比世代：他有什麼是你這一代比較缺少的，例如耐心、節儉、韌性。"],
 d:"從外在描述走到價值觀：What strikes me is not his age but his outlook on life…，再接一句你從中學到什麼。",
 v:[["wealth of experience","n.","豐富的經驗","My grandfather has a wealth of experience to draw on."],
    ["go through hardship","phr.","經歷艱苦","His generation went through hardship that I can hardly imagine."],
    ["resilient","adj.","有韌性的","She's one of the most resilient people I know."],
    ["set in their ways","idiom","固執、習慣難改","Unlike many people his age, he isn't set in his ways."],
    ["young at heart","idiom","心態年輕","She's nearly eighty but still very young at heart."],
    ["pass down","phr. v.","傳承","He loves passing down family stories to the grandchildren."]],
 s:["I'd like to talk about my grandmother, who is well into her seventies but…","What I find remarkable about him is…"],
 q:[{t:"What can young people learn from older people?",
     a:["具體化：不是只說「經驗」，而是哪種經驗，例如處理失敗、人際關係、金錢觀。"],
     v:[["life lesson","n.","人生道理","Older relatives can teach us life lessons you won't find in textbooks."],["in hindsight","phr.","事後回想","They can tell you what, in hindsight, really mattered."],["put things in perspective","phr.","用更宏觀的角度看事情","Talking to my grandmother always puts things in perspective."]],
     s:"Quite a lot, actually. The first thing that comes to mind is…"},
    {t:"Why do some older people find it hard to adapt to new technology?",
     a:["原因分層：不是「不會」，而是沒有需求、怕出錯、介面沒考慮到他們。可以順便提解方。"],
     v:[["tech-savvy","adj.","精通科技的","My parents aren't exactly tech-savvy, but they manage."],["steep learning curve","n.","陡峭的學習曲線","Smartphones have a steep learning curve for some elderly users."],["keep up with","phr. v.","跟上","It's hard to keep up with how fast apps change."]],
     s:"I think it mostly comes down to…"},
    {t:"Should older people continue working after retirement age?",
     a:["看健康與意願。個人層面（成就感）與社會層面（勞動力、年輕人的機會）都談。"],
     v:[["sense of purpose","n.","目標感、人生意義","Work gives many people a sense of purpose."],["aging population","n.","高齡化人口","With an aging population, we may not have much choice."],["make way for","phr.","讓位給","Some argue they should make way for younger workers."]],
     s:"It depends on the individual, but on the whole I'd say…"},
    {t:"How are elderly people treated in your country compared with the past?",
     a:["過去（多代同堂、孝道）對比現在（小家庭、長照機構）。用 tend to，避免下絕對結論。"],
     v:[["extended family","n.","大家庭","People used to live in extended families under one roof."],["nursing home","n.","養老院","More families are now turning to nursing homes."],["filial duty","n.","孝道、子女的責任","Looking after your parents is still seen as a filial duty."]],
     s:"Traditionally, … but these days things are gradually changing."}]},

{id:"c03",cat:"person",t:"Describe a friend you enjoy spending time with.",
 p:["who this friend is","how you met","what you usually do together","and explain why you enjoy their company."],
 a:["講一個只有你們懂的默契或習慣，比列舉活動更生動。","談這段友誼為什麼能維持：共同的價值觀、互補的個性、彼此說真話。"],
 d:"把 We have fun together 升級成 What I value is that I can be completely myself around her，講友誼帶給你的東西。",
 v:[["hit it off","idiom","一見如故","We hit it off straight away on the first day of university."],
    ["have a lot in common","phr.","有很多共同點","We have a lot in common, especially our taste in music."],
    ["on the same wavelength","idiom","頻率相同、很合拍","We're on the same wavelength, so I never have to explain myself."],
    ["through thick and thin","idiom","同甘共苦","She has stuck by me through thick and thin."],
    ["catch up","phr. v.","敘舊、聊近況","We try to catch up over coffee every couple of weeks."],
    ["lose touch","phr.","失去聯絡","Unlike most of my school friends, we never lost touch."]],
 s:["I'd like to tell you about a close friend of mine called…","The thing I appreciate most about him is…"],
 q:[{t:"What do you think makes a good friend?",
     a:["挑一到兩個特質深入講並舉例，不要列一長串形容詞。"],
     v:[["trustworthy","adj.","值得信賴的","Above all, a good friend has to be trustworthy."],["be there for","phr.","在…需要時陪伴","A real friend will be there for you when things go wrong."],["brutally honest","adj.","毫不留情地誠實","I appreciate friends who are brutally honest with me."]],
     s:"For me, the most important quality has to be…"},
    {t:"Is it easier to make friends as a child or as an adult?",
     a:["比較環境：小時候有學校這個天然場域；成人時間少、戒心高，但友誼更有選擇性。"],
     v:[["strike up a conversation","phr.","主動攀談","Kids can strike up a conversation with anyone in the playground."],["social circle","n.","社交圈","As adults, our social circle tends to shrink."],["guarded","adj.","有戒心的","Adults are generally more guarded with strangers."]],
     s:"Definitely as a child, and I think the main reason is…"},
    {t:"Can online friendships be as strong as face-to-face ones?",
     a:["承認可以，但說出差別：線上容易開始，卻缺少共同經歷和非語言訊息。"],
     v:[["face-to-face","adj.","面對面的","Nothing quite replaces face-to-face contact."],["body language","n.","肢體語言","You miss out on body language when you only chat online."],["superficial","adj.","表面的","Some online friendships stay fairly superficial."]],
     s:"They can be, although I think something is inevitably missing…"},
    {t:"Why do some friendships end as people get older?",
     a:["原因是人生階段不同（工作、搬家、成家），通常不是誰的錯。可以加一句個人觀察。"],
     v:[["drift apart","phr. v.","漸行漸遠","People naturally drift apart when their lives go in different directions."],["priorities shift","phr.","優先順序改變","Once people start a family, their priorities shift."],["make the effort","phr.","花心思去做","A friendship only lasts if both sides make the effort."]],
     s:"In most cases there's no big falling-out; it's more that…"}]},

{id:"c04",cat:"person",t:"Describe a person who is very good at their job.",
 p:["who this person is","what job they do","how you know about their work","and explain why you think they are good at it."],
 a:["用一個你親眼看到的場景證明他厲害，例如處理突發狀況、對待客人的方式。","分析「好」從哪來：天分、訓練，還是態度？哪個最關鍵。"],
 d:"把 He is professional 換成具體行為加上你的解讀：The way he handled that complaint showed me that real expertise is about staying calm under pressure.",
 v:[["go the extra mile","idiom","多付出一分心力","She always goes the extra mile for her patients."],
    ["attention to detail","n.","注重細節","His attention to detail is what sets him apart."],
    ["take pride in","phr.","用心對待、以…為榮","He clearly takes pride in his work."],
    ["know the job inside out","idiom","對工作瞭若指掌","After twenty years, she knows the job inside out."],
    ["stay calm under pressure","phr.","在壓力下保持冷靜","He manages to stay calm under pressure, even on the busiest days."],
    ["second nature","n.","習慣成自然","Dealing with difficult customers has become second nature to her."]],
 s:["The person I have in mind is a…, and I've seen first-hand how…","What really sets her apart from others is…"],
 q:[{t:"What qualities do people need to be successful at work?",
     a:["分硬實力與軟實力，說哪個在現在更重要、為什麼。"],
     v:[["work ethic","n.","敬業精神","A strong work ethic matters more than raw talent."],["interpersonal skills","n.","人際溝通能力","Interpersonal skills are essential in almost every job."],["adaptable","adj.","適應力強的","You have to be adaptable because industries change so fast."]],
     s:"I'd say it's a combination of things, but if I had to pick one…"},
    {t:"Is it more important to enjoy your job or to earn a high salary?",
     a:["避免一面倒：短期和長期、不同人生階段的需求不同。"],
     v:[["job satisfaction","n.","工作滿足感","Job satisfaction keeps people motivated in the long run."],["make ends meet","idiom","收支平衡、餬口","Of course, you still need enough to make ends meet."],["burn out","phr. v.","身心俱疲","People who hate their jobs tend to burn out quickly."]],
     s:"Ideally both, but realistically…"},
    {t:"How has technology changed the way people work?",
     a:["正反都講：效率提升，但下班後仍被訊息綁住。"],
     v:[["work remotely","phr.","遠距工作","Many people can now work remotely at least part of the week."],["streamline","v.","使流程更有效率","Software has streamlined a lot of repetitive tasks."],["blur the line","phr.","模糊界線","It has blurred the line between work and private life."]],
     s:"It has transformed it in several ways. The most obvious one is…"},
    {t:"Do you think some jobs deserve higher pay than others?",
     a:["區分「應該」與「現實」：理想上依貢獻，現實上依市場供需。"],
     v:[["undervalued","adj.","被低估的","Nurses and teachers are seriously undervalued."],["contribute to society","phr.","對社會有貢獻","Pay should reflect how much a job contributes to society."],["supply and demand","n.","供需","In reality, salaries are driven by supply and demand."]],
     s:"In an ideal world, yes, though the reality is rather different…"}]},

{id:"c05",cat:"person",t:"Describe a famous person you would like to meet.",
 p:["who this person is","what they are famous for","what you would talk about","and explain why you would like to meet them."],
 a:["不要只講成就；講你想問他的一個「非公開面」的問題，例如失敗、懷疑自己的時候。","連結到自己：他的故事和你目前的處境有什麼關係。"],
 d:"用假設語氣展現文法：If I ever got the chance to sit down with him, I'd ask how he coped with…",
 v:[["household name","n.","家喻戶曉的人物","He's a household name all over Asia."],
    ["rise to fame","phr.","成名","She rose to fame in her early twenties."],
    ["behind the scenes","phr.","幕後","I'd love to know what goes on behind the scenes."],
    ["pick their brain","idiom","向某人請教","I'd really like to pick his brain about how he trains."],
    ["overcome setbacks","phr.","克服挫折","He overcame setbacks that would have stopped most people."],
    ["live up to the hype","idiom","名副其實","I'm curious whether he would live up to the hype in person."]],
 s:["If I could meet anyone, it would probably be…","I've followed her career for years, mainly because…"],
 q:[{t:"Why are people so interested in the lives of celebrities?",
     a:["從心理層面講：好奇、嚮往，以及把名人當作社交話題。"],
     v:[["escapism","n.","逃避現實的消遣","Celebrity gossip is a form of escapism for many people."],["glamorous lifestyle","n.","光鮮亮麗的生活","People are drawn to their glamorous lifestyle."],["relate to","phr. v.","產生共鳴","Fans want to see that stars are people they can relate to."]],
     s:"I suppose part of it is simple curiosity, but there's also…"},
    {t:"What are the disadvantages of being famous?",
     a:["不只講隱私；延伸到心理健康、分不清誰是真朋友。"],
     v:[["invasion of privacy","n.","侵犯隱私","The constant invasion of privacy must be exhausting."],["under constant scrutiny","phr.","持續被檢視","Everything they say is under constant scrutiny."],["take a toll on","phr.","對…造成傷害","Fame can take a toll on people's mental health."]],
     s:"The obvious one is the lack of privacy, but beyond that…"},
    {t:"Do celebrities have a responsibility to behave well in public?",
     a:["有影響力就有責任，但他們也是普通人、沒簽約當榜樣。選一邊，同時承認另一邊。"],
     v:[["public figure","n.","公眾人物","Like it or not, public figures shape how young people behave."],["hold accountable","phr.","追究責任","I think they should be held accountable for what they say."],["double standard","n.","雙重標準","There's often a double standard for famous people."]],
     s:"I'd argue that they do, simply because…"},
    {t:"How has social media changed what it means to be famous?",
     a:["門檻降低，人人可紅，但壽命變短。比較傳統名人與網紅。"],
     v:[["overnight sensation","n.","一夜爆紅的人","Anyone can become an overnight sensation these days."],["short-lived","adj.","短暫的","That kind of fame tends to be short-lived."],["build a following","phr.","累積粉絲","Ordinary people can build a following without any agent."]],
     s:"It has completely lowered the barrier, in the sense that…"}]},

{id:"c06",cat:"person",t:"Describe someone who often helps others.",
 p:["who this person is","how you know them","what kind of help they give","and explain why you think they help others."],
 a:["講一次具體的幫助，以及受助者的反應。","探討動機：天性、家庭教育，還是自己曾被幫助過？"],
 d:"加入你的反思：Seeing her do that made me question how little I do for the people around me.",
 v:[["selfless","adj.","無私的","She's one of the most selfless people I've ever met."],
    ["lend a hand","idiom","伸出援手","He's always the first to lend a hand when a neighbor is in trouble."],
    ["go out of their way","idiom","特地費心去做","She goes out of her way to make newcomers feel welcome."],
    ["expect nothing in return","phr.","不求回報","He helps people and expects nothing in return."],
    ["compassionate","adj.","有同理心的","She's a deeply compassionate person."],
    ["give back to the community","phr.","回饋社區","Volunteering is his way of giving back to the community."]],
 s:["The first person who comes to mind is my aunt, who seems to spend half her life helping people.","I think what drives him is…"],
 q:[{t:"Why do some people enjoy helping others?",
     a:["內在動機（成就感、同理心）與外在因素（宗教、家庭教育）都可以談。"],
     v:[["sense of fulfillment","n.","滿足感","Helping others gives people a sense of fulfillment."],["empathy","n.","同理心","Some people simply have more empathy than others."],["rewarding","adj.","有回報感的、值得的","Volunteering can be incredibly rewarding."]],
     s:"I think for most people it comes down to…"},
    {t:"Should schools require students to do volunteer work?",
     a:["指出矛盾：「強制的志願」還算志願嗎？但強制能讓原本不會接觸的人接觸到。"],
     v:[["compulsory","adj.","強制的","I'm not sure it should be compulsory."],["defeat the purpose","idiom","失去原本的意義","Forcing students to volunteer might defeat the purpose."],["civic responsibility","n.","公民責任","It can teach teenagers civic responsibility."]],
     s:"I'm in two minds about this, to be honest…"},
    {t:"Do people help each other less now than in the past?",
     a:["不要直接說「變冷漠」；指出幫助的形式變了，從鄰里互助變成線上捐款。"],
     v:[["close-knit community","n.","關係緊密的社區","People used to live in close-knit communities."],["keep to themselves","idiom","不與人往來","In big cities, people tend to keep to themselves."],["crowdfunding","n.","群眾募資","On the other hand, crowdfunding lets strangers help each other."]],
     s:"It might look that way, but I'd say the form of help has changed…"},
    {t:"What can governments do to support people in need?",
     a:["分短期救助與長期的根本措施（教育、就業）。"],
     v:[["safety net","n.","社會安全網","A proper safety net prevents people from falling into poverty."],["affordable housing","n.","平價住宅","Affordable housing should be a priority."],["vulnerable","adj.","弱勢的","The most vulnerable groups are often the least visible."]],
     s:"There are short-term and long-term measures. In the short term…"}]},

{id:"c07",cat:"place",t:"Describe a place where you like to relax.",
 p:["where it is","how often you go there","what you do there","and explain why it helps you relax."],
 a:["用感官描述：聲音、光線、氣味，讓畫面具體。","對比你平常的生活節奏和在那裡的狀態。"],
 d:"講你為什麼需要這個地方：It's the one place where I'm not expected to be productive，把地點連到現代生活的壓力。",
 v:[["unwind","v.","放鬆","It's where I go to unwind after a long week."],
    ["get away from it all","idiom","遠離一切煩囂","Sometimes I just need to get away from it all."],
    ["hustle and bustle","n.","喧囂繁忙","It's a world away from the hustle and bustle of the city."],
    ["tranquil","adj.","寧靜的","The atmosphere there is surprisingly tranquil."],
    ["recharge my batteries","idiom","充電、恢復精力","An hour there is enough to recharge my batteries."],
    ["clear my head","idiom","讓頭腦清醒","A short walk by the river helps me clear my head."]],
 s:["There's a small park not far from where I live that I think of as my escape.","What makes it so calming is…"],
 q:[{t:"Why do people today find it hard to relax?",
     a:["原因：科技讓工作滲入生活、社群上的比較、休息時的罪惡感。"],
     v:[["switch off","phr. v.","放空、不再想工作","Many people can't switch off even on weekends."],["always on call","phr.","隨時待命","Smartphones mean we're always on call."],["hectic schedule","n.","忙碌的行程","A hectic schedule leaves little room for rest."]],
     s:"I think the main culprit is…"},
    {t:"Are public parks important in cities?",
     a:["功能分類：身心健康、社交、生態、降溫。挑兩個展開。"],
     v:[["green space","n.","綠地","Green spaces make a city far more livable."],["concrete jungle","n.","水泥叢林","Without parks, a city is just a concrete jungle."],["breath of fresh air","idiom","透透氣／令人耳目一新","A park offers a breath of fresh air, quite literally."]],
     s:"Absolutely. Apart from the obvious health benefits…"},
    {t:"Do people relax differently now compared with the past?",
     a:["從主動（運動、手作、串門子）到被動（滑手機、追劇）。順便問：真的有放鬆到嗎？"],
     v:[["screen time","n.","使用螢幕的時間","A lot of our downtime is now screen time."],["binge-watch","v.","一口氣追完劇","People binge-watch entire series in one weekend."],["passive","adj.","被動的","Entertainment has become more passive than it used to be."]],
     s:"Yes, quite dramatically. A generation ago…"},
    {t:"Is it better to relax alone or with other people?",
     a:["看個性與當下狀態；兩種休息補充的是不同的能量。"],
     v:[["introvert","n.","內向的人","As an introvert, I recharge by being alone."],["quality time","n.","有品質的相處時光","Spending quality time with friends can be just as restful."],["peace and quiet","n.","安寧","After a busy day, all I want is some peace and quiet."]],
     s:"It really depends on your personality…"}]},

 d:"從景點走到城市的個性：What stayed with me wasn't the landmarks but the pace of life…",

    ["wander around","phr. v.","四處閒逛","I spent hours just wandering around the old town."],
    ["rich in history","phr.","歷史悠久","The whole area is rich in history."],
    ["off the beaten track","idiom","遠離觀光客的、冷門的","We found a little restaurant off the beaten track."],
    ["soak up the atmosphere","phr.","感受氣氛","I sat in a square for an hour just soaking up the atmosphere."],
    ["live up to my expectations","phr.","符合期待","The city more than lived up to my expectations."]],
 s:["One city I keep thinking about is…, which I visited a couple of years ago.","What struck me as soon as I arrived was…"],

    {t:"What makes a neighborhood a good place to live?",

     s:"If I had to bet on one, it would be…"}]},

  else if (n > 3 && w.endsWith('s') && !/(ss|us|is)$/.test(w)) w = w.slice(0, -1);
  if (w.length > 3 && w.endsWith('e')) w = w.slice(0, -1);
  if (w.length > 3 && /([b-df-hj-np-tv-z])\1$/.test(w)) w = w.slice(0, -1);
  return w;
}

const WORD_RE = /[A-Za-z0-9]+(?:['’][A-Za-z]+)*/g;
function toks(text) {
  const out = []; let m; WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text))) {
    const low = m[0].toLowerCase().replace(/’/g, "'");
    out.push({ low, st: stem(low), s: m.index, e: m.index + m[0].length });
  }
  return out;
}
const KEYS = new Map();
function phraseKey(p) {
  if (KEYS.has(p)) return KEYS.get(p);
  const t = toks(p).filter(x => !ARTICLES.has(x.low));
  const key = t.map(x => (t.length >= 3 && POSS.has(x.low)) ? '*' : x.st);
  KEYS.set(p, key); return key;
}

const TOOLS = [];
TOOLBOX.forEach(c => c.items.forEach(it => {
  const k = reg(cleanP(it[0]), '表達', it[1], it[2], '表達工具箱 · ' + c.title);
  TOOLS.push({ p: it[0], cat: c.id, title: c.title, lex: k, key: it[3] === '' ? [] : phraseKey(it[3] || it[0].replace(/…/g, ' ')) });
}));
TOOLS.sort((a, b) => b.key.length - a.key.length);

const LIKE_PREV = new Set(['i', 'you', 'we', 'they', 'who', 'people', 'would', "i'd", "we'd", "don't", "doesn't", "didn't", 'to', 'really', 'always', 'also', 'feel', 'feels', 'felt', 'look', 'looks', 'looked', 'sound', 'sounds', 'seem', 'seems', 'is', 'was', "it's", 'just', 'not', 'much', 'things', 'stuff', 'something', 'anything', 'nothing', 'more', 'most', 'still', 'never', 'kids', 'children', 'students']);
const KIND_PREV = new Set(['a', 'what', 'this', 'that', 'some', 'any', 'the', 'which', 'every', 'one', 'of', 'different', 'same', 'new', 'another']);
const KNOW_PREV = new Set(['do', 'did', "don't", 'if', 'as', 'what', 'how', 'when', 'once', 'before', 'until']);

function analyze(text, dur, vocab) {
  text = text || '';
  const T = toks(text), n = T.length;
  const F = []; for (let i = 0; i < n; i++) if (!ARTICLES.has(T[i].low)) F.push(i);
  const marks = new Array(n).fill(null); let gid = 0;
  const findStem = key => {
    const hits = [], L = key.length; if (!L) return hits;
    for (let i = 0; i + L <= F.length; i++) {
      let ok = true;
      for (let j = 0; j < L; j++) { const t = T[F[i + j]]; if (key[j] === '*' ? !POSS.has(t.low) : t.st !== key[j]) { ok = false; break; } }
      if (ok) hits.push([F[i], F[i + L - 1]]);
    }
    return hits;
  };
  const findExact = words => {
    const hits = [], L = words.length;
    for (let i = 0; i + L <= n; i++) { let ok = true; for (let j = 0; j < L; j++) if (T[i + j].low !== words[j]) { ok = false; break; } if (ok) hits.push([i, i + L - 1]); }
    return hits;
  };
  const free = (h, minPri) => { for (let i = h[0]; i <= h[1]; i++) if (marks[i] && marks[i].pri >= minPri) return false; return true; };
  const put = (h, cls, pri, tip) => { if (!free(h, 0)) return; gid++; for (let i = h[0]; i <= h[1]; i++) marks[i] = { cls, pri, gid, tip }; };

  const used = (vocab || []).map(v => { const hits = findStem(phraseKey(v[0])); hits.forEach(h => put(h, 'm-vocab', 5, '本題加分詞彙')); return hits.length > 0; });

  const tools = [];
  TOOLS.forEach(t => {
    const hits = findStem(t.key).filter(h => free(h, 5));
    if (hits.length) { tools.push(t); hits.forEach(h => put(h, 'm-tool', 4, '工具箱：' + t.title)); }
  });

  const strong = [], soft = []; let strongN = 0, softN = 0;
  FILLER_STRONG.forEach(f => {
    let hits = findExact(f.split(' ')).filter(h => free(h, 4));
    if (f === 'you know') hits = hits.filter(h => h[0] === 0 || !KNOW_PREV.has(T[h[0] - 1].low));
    if (hits.length) { strong.push([f, hits.length]); strongN += hits.length; hits.forEach(h => put(h, 'm-filler', 3, '贅字')); }
  });
  FILLER_SOFT.forEach(f => {
    let hits = findExact(f.split(' ')).filter(h => free(h, 3));
    if (f === 'like') hits = hits.filter(h => h[0] === 0 || !LIKE_PREV.has(T[h[0] - 1].low));
    if (f === 'well') hits = hits.filter(h => h[0] === 0);
    if (f === 'kind of' || f === 'sort of') hits = hits.filter(h => h[0] === 0 || !KIND_PREV.has(T[h[0] - 1].low));
    if (hits.length) { soft.push([f, hits.length]); softN += hits.length; hits.forEach(h => put(h, 'm-soft', 2, '口頭禪，留意頻率')); }
  });

  const shallow = [];
  SHALLOW.forEach(sw => {
    let c = 0, all = [];
    sw.k.forEach(k => { const hits = findExact(k.split(' ')).filter(h => free(h, 4)); c += hits.length; all = all.concat(hits); });
    if (!c) return;
    const flag = c >= sw.min && (c / n * 100) >= sw.rate;
    if (flag) { shallow.push({ label: sw.k[0], c, alt: sw.alt, cat: sw.cat }); all.forEach(h => put(h, 'm-shallow', 1, '出現次數偏高')); }
  });

  let html = '', pos = 0;
  for (let i = 0; i < n; i++) {
    const t = T[i], m = marks[i], prev = i > 0 ? marks[i - 1] : null, next = i < n - 1 ? marks[i + 1] : null;
    const gap = esc(text.slice(pos, t.s));
    const opens = m && (!prev || prev.gid !== m.gid), closes = m && (!next || next.gid !== m.gid);
    html += gap + (opens ? `<span class="${m.cls}" title="${esc(m.tip)}">` : '') + esc(text.slice(t.s, t.e)) + (closes ? '</span>' : '');
    pos = t.e;
  }
  html += esc(text.slice(pos));

  const wpm = (dur >= 5 && n > 0) ? Math.round(n / (dur / 60)) : null;
  return { n, wpm, used, usedN: used.filter(Boolean).length, tools, strong, strongN, soft, softN, shallow, html };
}

/* ================= 抽題、單字本、歷史 ================= */
/* seen：實際回答過的題目（會保存，等於題庫進度）。SHOWN：這次開啟頁面後出現過但沒回答的題目，只用來避免「換一張」時馬上重複。 */
const SHOWN = { [K.seen2]: new Set(), [K.seen3]: new Set() };
const answered = it => it.done && !!it.text;
function draw(ids, key, avoid) {
  const seen = store.get(key, []), shown = SHOWN[key];
  const fresh = () => ids.filter(id => !seen.includes(id) && !shown.has(id));
  let pool = fresh(), re = false;
  if (!pool.length && shown.size) { shown.clear(); pool = fresh().filter(id => id !== avoid); if (!pool.length) pool = fresh(); }
  if (!pool.length) { store.set(key, []); shown.clear(); pool = ids.filter(id => id !== avoid); if (!pool.length) pool = ids.slice(); re = true; }
  const id = pool[rand(pool.length)]; shown.add(id);
  return { id, re };
}
function markSeen(key, ids) { const seen = store.get(key, []); ids.forEach(id => { if (!seen.includes(id)) seen.push(id); }); store.set(key, seen); }
function pickP3(card) {
  const seen = store.get(K.seen3, []);
  const qs = shuffle(card.q.slice());
  qs.sort((a, b) => (seen.includes(a.id) ? 1 : 0) - (seen.includes(b.id) ? 1 : 0));
  return qs.slice(0, 3);
}

let starSet = new Set(store.get(K.vocab, []).map(v => v.k));
function toggleStar(k) {
  let list = store.get(K.vocab, []);
  if (starSet.has(k)) list = list.filter(v => v.k !== k);
  else if (LEX[k]) list.unshift(Object.assign({ ts: Date.now() }, LEX[k]));
  store.set(K.vocab, list); starSet = new Set(list.map(v => v.k));
  return starSet.has(k);
}
const starBtn = k => { const on = starSet.has(k); return `<button class="star${on ? ' on' : ''}" data-act="star" data-k="${esc(k)}" aria-pressed="${on}" aria-label="${on ? '取消收藏' : '收藏到單字本'}" title="${on ? '取消收藏' : '收藏到單字本'}">${on ? '★' : '☆'}</button>`; };

function saveSession() {
  const s = S.sess; if (!s) return;
  const items = s.items.filter(answered).map(it => ({ kind: it.kind, rid: it.ref.id, q: it.ref.t, text: it.text, dur: it.dur }));
  let h = store.get(K.hist, []);
  const i = h.findIndex(x => x.id === s.id);
  if (!items.length) { if (i >= 0) { h.splice(i, 1); store.set(K.hist, h); } return; }
  const rec = { id: s.id, ts: s.ts, mode: s.mode, title: s.mode === 'A' ? s.card.t : 'Part 3 連續練習', items };
  if (i >= 0) h[i] = rec; else h.unshift(rec);
  if (h.length > 200) h.length = 200;
  store.set(K.hist, h);
}

/* ================= 錄音與辨識 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const R = {}; const P = { tick: null, t0: 0 };

function recReset() {
  clearInterval(R.tick); clearTimeout(R.killer);
  const old = R.r; R.r = null; if (old) { try { old.abort(); } catch (e) { } }
  Object.assign(R, { on: false, done: false, manual: false, base: '', sess: '', interim: '', t0: 0, dur: 0, limit: 0, errs: 0, fatal: null, onDone: null, tick: null, killer: null });
}
const recElapsed = () => R.t0 ? (Date.now() - R.t0) / 1000 : 0;
function startClock() { if (R.t0) return; R.t0 = Date.now(); R.tick = setInterval(() => { paintClock(); if (R.on && R.limit && recElapsed() >= R.limit) recStop(); }, 200); paintClock(); }
function setRecState(txt, live) { const a = $('#recState'), d = $('#dot'); if (a) a.textContent = txt; if (d) d.classList.toggle('on', !!live); }

function recBegin(limit, onDone, manual) {
  recReset(); R.limit = limit; R.onDone = onDone; R.on = true; R.manual = !!manual || !SR;
  if (R.manual) { startClock(); setRecState('手動輸入模式，計時中', true); return; }
  spawn();
}
function spawn() {
  const r = new SR(); R.r = r;
  r.lang = 'en-US'; r.continuous = !IS_ANDROID; r.interimResults = true; r.maxAlternatives = 1;
  r.onstart = () => { if (R.r !== r) return; startClock(); setRecState('錄音中，請開始說話', true); };
  r.onresult = e => {
    if (R.r !== r) return;
    let fin = '', inter = '';
    for (let i = 0; i < e.results.length; i++) { const res = e.results[i], t = res[0].transcript.trim(); if (!t) continue; if (res.isFinal) fin += t + ' '; else inter += t + ' '; }
    R.sess = fin.trim(); R.interim = inter.trim(); R.errs = 0; paintLive();
  };
  r.onerror = e => {
    if (R.r !== r) return;
    const c = e.error;
    if (c === 'no-speech' || c === 'aborted') return;
    if (c === 'not-allowed' || c === 'service-not-allowed' || c === 'audio-capture') R.fatal = c;
    else if (++R.errs >= 4) R.fatal = c;
  };
  r.onend = () => {
    if (R.r !== r) return;
    commit();
    if (R.fatal) { R.on = false; clearInterval(R.tick); R.dur = recElapsed(); showRecError(R.fatal); return; }
    if (R.on) setTimeout(() => { if (R.on && R.r === r) spawn(); }, 200);
    else finish();
  };
  try { r.start(); } catch (err) { R.fatal = 'start-failed'; R.on = false; showRecError(R.fatal); }
}
function commit() { const add = [R.sess, R.interim].filter(Boolean).join(' '); if (add) R.base = (R.base + ' ' + add).trim(); R.sess = ''; R.interim = ''; }
function recStop() {
  if (!R.on) return;
  R.on = false; R.dur = recElapsed(); clearInterval(R.tick);
  if (R.manual || !R.r) return finish();
  setRecState('整理逐字稿中…', false);
  try { R.r.stop(); } catch (e) { }
  R.killer = setTimeout(finish, 1800);
}
function finish() {
  if (R.done) return; R.done = true; clearTimeout(R.killer); commit();
  const r = R.r; R.r = null; if (r) { try { r.abort(); } catch (e) { } }
  let text = R.base.trim();
  if (R.manual) { const m = $('#manual'); text = m ? m.value.trim() : ''; }
  const cb = R.onDone; if (cb) cb(text, Math.round(R.dur));
}
function paintLive() {
  const el = $('#live'); if (!el) return;
  const fin = [R.base, R.sess].filter(Boolean).join(' ');
  if (!fin && !R.interim) return;
  el.innerHTML = esc(fin) + (R.interim ? ` <span class="int">${esc(R.interim)}</span>` : '');
  el.scrollTop = el.scrollHeight;
}
function showRecError(code) {
  setRecState('麥克風已停止', false);
  const msg = {
    'not-allowed': '沒有取得麥克風權限。請點網址列左側的鎖頭圖示，把麥克風設為「允許」，再按重試。',
    'service-not-allowed': '這個瀏覽器不允許使用語音辨識。請改用 Chrome 或 Edge，或改用手動輸入。',
    'audio-capture': '找不到麥克風。請確認麥克風已接上，再按重試。',
    'network': '語音辨識需要網路連線。請檢查網路後再重試。',
    'start-failed': '語音辨識無法啟動。請重試，或改用手動輸入。'
  }[code] || '語音辨識發生問題（' + code + '）。請重試，或改用手動輸入。';
  const el = $('#recMsg'); if (!el) return;
  const kept = R.base ? '<br>已辨識到的內容會保留，可以直接看結果。' : '';
  el.innerHTML = `<div class="banner bad">${esc(msg)}${kept}<div class="actions" style="margin-top:10px"><button class="btn sm" data-act="retryRec">重試</button><button class="btn sm" data-act="manualRec">改用手動輸入</button>${R.base ? '<button class="btn sm primary" data-act="useKept">直接看結果</button>' : ''}</div></div>`;
}
function warmMic() {
  if (!SR || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(() => { });
}
function stopAll() { clearInterval(P.tick); P.tick = null; recReset(); }

function paintClock() {
  const el = $('#clock'); if (!el) return;
  const t = recElapsed(), it = cur(), bar = $('#bar'), sub = $('#clockSub');
  el.textContent = fmt(Math.floor(t));
  let w, pct, txt;
  if (it.kind === 'p2') { const left = 120 - t; w = left <= 30; pct = t / 120; txt = w ? `剩下 ${Math.max(0, Math.ceil(left))} 秒，準備收尾` : '最長 2:00，講到 1 分半以上比較理想'; }
  else { w = t >= 60; pct = t / 60; txt = t < 30 ? '建議回答 30 到 60 秒' : (w ? '已超過 60 秒，可以收尾了' : '長度剛好，講完就可以結束'); }
  el.classList.toggle('warn', w); bar.classList.toggle('warn', w);
  bar.firstElementChild.style.width = Math.min(100, pct * 100) + '%'; sub.textContent = txt;
}

/* ================= 狀態與流程 ================= */
const S = { view: 'home', stage: null, sess: null, editing: false, hideZh: false, vq: '', manual: false };
const cur = () => S.sess.items[S.sess.pos];
const newItem = (kind, ref) => ({ kind, ref, text: '', dur: 0, done: false });
const newId = () => Date.now().toString(36) + rand(1e6).toString(36);

function startA() {
  stopAll();
  const d = draw(P2_IDS, K.seen2, S.sess && S.sess.card ? S.sess.card.id : null);
  const c = CARD[d.id];
  S.sess = { id: newId(), ts: Date.now(), mode: 'A', card: c, items: [newItem('p2', c)], pos: 0, queue: pickP3(c), notes: '' };
  S.view = 'practice'; S.stage = 'card'; S.editing = false; render();
  if (d.re) toast('Part 2 題庫已全部練完，重新洗牌！');
}
function startB() {
  stopAll();
  S.sess = { id: newId(), ts: Date.now(), mode: 'B', card: null, items: [], pos: -1, notes: '' };
  S.view = 'practice'; nextB();
}
function nextB() {
  const s = S.sess, last = s.items.length ? s.items[s.items.length - 1].ref.id : null;
  const d = draw(P3_IDS, K.seen3, last);
  s.items.push(newItem('p3', Q3[d.id])); s.pos = s.items.length - 1;
  S.stage = 'ask'; S.editing = false; render();
  if (d.re) toast('Part 3 題庫已全部練完，重新洗牌！');
}
function goPrep() {
  warmMic(); S.stage = 'prep'; render();
  P.t0 = Date.now();
  P.tick = setInterval(() => {
    const left = 60 - (Date.now() - P.t0) / 1000, el = $('#ptimer'), bar = $('#pbar');
    if (el) { el.textContent = fmt(Math.ceil(Math.max(0, left))); el.classList.toggle('warn', left <= 10); }
    if (bar) bar.firstElementChild.style.width = Math.min(100, (60 - left) / 60 * 100) + '%';
    if (left <= 0) goSpeak();
  }, 200);
}
function goSpeak(manual) {
  const n = $('#notes'); if (n) S.sess.notes = n.value.trim();
  clearInterval(P.tick); P.tick = null;
  const it = cur(); S.manual = !!manual || !SR; S.stage = 'speak'; S.editing = false; render();
  recBegin(it.kind === 'p2' ? 120 : 300, (text, dur) => {
    it.text = text; it.dur = dur; it.done = true; commitItem(it);
    S.stage = 'result'; S.editing = !text; render();
  }, S.manual);
}
function commitItem(it) { if (it.text) markSeen(it.kind === 'p2' ? K.seen2 : K.seen3, [it.ref.id]); saveSession(); }
function toP3() {
  const s = S.sess; s.pos++;
  if (s.pos > 3) { S.stage = 'summary'; render(); return; }
  if (!s.items[s.pos]) { const q = s.queue[s.pos - 1]; SHOWN[K.seen3].add(q.id); s.items[s.pos] = newItem('p3', q); }
  S.stage = 'ask'; S.editing = false; render();
}

/* ================= 畫面 ================= */
function vrow(v, src) {
  const k = lexKey(v[0]);
  return `<div class="vrow"><div><b lang="en">${esc(v[0])}</b><span class="pos">${esc(v[1])}</span><span class="zh">${esc(v[2])}</span><div class="ex" lang="en">${esc(v[3])}</div>${src ? `<div class="src">來源：<span lang="en">${esc(src)}</span></div>` : ''}</div>${starBtn(k)}</div>`;
}
function hintsHTML(ref, kind, open) {

  </div></details>`;
}
const cueHTML = (c, compact) => `<article class="cue${compact ? ' compact' : ''}"><header><span class="eyebrow">Part 2 · Cue Card</span><span class="pill">${CAT[c.cat]}</span></header><h2 lang="en">${esc(c.t)}</h2><p class="say">You should say:</p><ul lang="en">${c.p.map(x => `<li>${esc(x)}</li>`).join('')}</ul></article>`;
const qHTML = (q, label) => `<article class="qcard"><span class="eyebrow">${label}</span><h2 lang="en">${esc(q.t)}</h2><p class="from">延伸自題卡：<span lang="en">${esc(q.card.t)}</span></p></article>`;
function partLabel() {

  return s.mode === 'A' ? `Part 3 · 第 ${s.pos} / 3 題` : `Part 3 · 第 ${s.pos + 1} 題`;
}
const itemBlock = (it, compact) => it.kind === 'p2' ? cueHTML(it.ref, compact) : qHTML(it.ref, partLabel());

function viewHome() {
  const s2 = store.get(K.seen2, []).filter(id => CARD[id]).length, s3 = store.get(K.seen3, []).filter(id => Q3[id]).length;
  return `<div class="stack">
  <section class="hero"><p class="eyebrow">IELTS Speaking · Part 2 &amp; Part 3</p><h1>開口練習，講完看得到自己說了什麼</h1><p class="lead">不重複的題庫、即時逐字稿，加上每題的思考角度與加分詞彙，目標口說 7.0 到 7.5。</p></section>
  ${SR ? '' : '<div class="banner warn"><b>這個瀏覽器不支援語音辨識。</b>請改用電腦版 Chrome 或 Edge，才能自動產生逐字稿。現在仍可計時練習，逐字稿需要手動輸入。</div>'}
  ${store.ok ? '' : '<div class="banner warn">瀏覽器目前無法儲存資料，練習進度、單字本和歷史紀錄在關閉頁面後不會保留。</div>'}
  <div class="modes">
    <button class="mode" data-act="startA"><span class="pill">模式 A</span><h2>Part 2 題卡，接著 3 題 Part 3</h2><p>抽一張題卡，準備 1 分鐘、講 2 分鐘，再回答 3 題延伸問題。最接近真實考試的流程。</p><span class="go">開始練習 →</span></button>
    <button class="mode" data-act="startB"><span class="pill">模式 B</span><h2>Part 3 連續練習</h2><p>一題接一題的討論題，沒有題數上限。適合零碎時間，專門練觀點與論述。</p><span class="go">開始練習 →</span></button>
  </div>
  <section class="card"><h3 class="sec">題庫進度</h3><div class="prog">
    <div class="prog-row"><span>Part 2</span><div class="meter"><i style="width:${s2 / P2_IDS.length * 100}%"></i></div><span class="fine">${s2} / ${P2_IDS.length}</span></div>
    <div class="prog-row"><span>Part 3</span><div class="meter"><i style="width:${s3 / P3_IDS.length * 100}%"></i></div><span class="fine">${s3} / ${P3_IDS.length}</span></div>
  </div><p class="fine" style="margin-top:12px">實際回答過的題目才會計入進度，之後不會重複出現。全部練完會自動重新洗牌。 <button class="btn ghost sm" data-act="resetSeen">重置進度</button></p></section>
  <section class="card"><h3 class="sec">怎麼用</h3><ol class="steps">
    <li><span>選一個模式，看到題目後先自己想，再決定要不要打開「學習提示」。</span></li>
    <li><span>按開始作答並允許麥克風，用英文回答。畫面會即時顯示辨識到的文字。建議使用電腦版 Chrome 或 Edge。</span></li>
    <li><span>講完後看逐字稿：綠色是你用到的加分詞彙，藍色是工具箱表達，底線是贅字和用太多次的字。</span></li>
    <li><span>卡住時點右下角的「表達工具箱」，找一個比 and、because、I think 更好的說法，下一題用出來。</span></li>
  </ol></section>
  <p class="fine">隱私說明：語音辨識由瀏覽器處理（Chrome 會把音訊傳到 Google 的辨識服務）。這個網頁不會上傳或保存你的聲音，逐字稿、單字本和歷史紀錄只存在你自己的瀏覽器裡。數據僅供練習參考，不是 IELTS 官方評分。</p>
  </div>`;
}

function viewPractice() {
  const s = S.sess, it = cur();
  const head = `<div class="phead"><span class="eyebrow">${s.mode === 'A' ? '模式 A' : '模式 B'} · ${partLabel()}</span><button class="btn ghost sm" data-act="quit">離開練習</button></div>`;
  if (S.stage === 'card') return head + `<div class="stack">${cueHTML(s.card)}
    <div class="actions"><button class="btn primary big" data-act="prep">開始準備（1 分鐘）</button><button class="btn" data-act="speakNow">直接開始作答</button><button class="btn ghost" data-act="startA">換一張</button></div>
    ${hintsHTML(s.card, 'p2')}
    <p class="fine">建議先自己想 10 秒再看提示。開始作答時瀏覽器會詢問麥克風權限，請選擇允許。</p></div>`;
  if (S.stage === 'prep') return head + `<div class="stack">
    <section class="card"><div class="timer-box"><div class="timer" id="ptimer">1:00</div><div class="timer-sub">準備時間。時間到會自動開始作答。</div></div><div class="bar" id="pbar"><i></i></div></section>
    ${cueHTML(s.card, true)}
    <textarea id="notes" rows="4" placeholder="筆記區：寫下關鍵字就好，不要寫完整句子。作答時會顯示在旁邊。">${esc(s.notes)}</textarea>
    <div class="actions"><button class="btn primary" data-act="speakNow">跳過準備，開始作答</button></div>
    ${hintsHTML(s.card, 'p2')}</div>`;
  if (S.stage === 'ask') return head + `<div class="stack">${qHTML(it.ref, partLabel())}
    <div class="actions"><button class="btn primary big" data-act="speakNow">開始作答</button>${s.mode === 'B' ? '<button class="btn ghost" data-act="swapQ">換一題</button>' : ''}</div>
    ${hintsHTML(it.ref, 'p3')}
    <p class="fine">Part 3 沒有準備時間。建議用「觀點、原因、例子、延伸」的順序，回答 30 到 60 秒。</p></div>`;
  if (S.stage === 'speak') return head + `<div class="stack">
    <section class="card"><div class="rec-line"><span class="dot" id="dot"></span><span id="recState">${S.manual ? '手動輸入模式' : '正在啟動麥克風，請允許權限…'}</span></div>
      <div class="timer-box"><div class="timer" id="clock">0:00</div><div class="timer-sub" id="clockSub">&nbsp;</div></div><div class="bar" id="bar"><i></i></div></section>
    ${itemBlock(it, true)}
    ${it.kind === 'p2' && s.notes ? `<div class="notes-view"><b>我的筆記</b>${esc(s.notes)}</div>` : ''}
    ${S.manual ? '<textarea class="en" id="manual" rows="7" placeholder="這個模式不會自動辨識。請開口回答，講完後把你說的內容打在這裡，再按結束作答。"></textarea>'
      : '<div class="live" id="live" lang="en"><span class="ph">開始說話，這裡會即時顯示辨識到的文字。</span></div>'}
    <div id="recMsg"></div>
    <div class="actions"><button class="btn stop big" data-act="stop">結束作答</button></div>
    ${hintsHTML(it.ref, it.kind)}</div>`;
  if (S.stage === 'result') return head + viewResult();
  return head + viewSummary();
}

function miniStats(an, dur) { return `${an.n} 字 · ${fmt(dur)} · ${an.wpm == null ? '—' : an.wpm + ' WPM'} · 贅字 ${an.strongN}`; }
const LEGEND = `<div class="legend"><span><span class="m-vocab">加分詞彙</span></span><span><span class="m-tool">工具箱表達</span></span><span><span class="m-filler">贅字</span></span><span><span class="m-soft">口頭禪</span></span><span><span class="m-shallow">用太多次</span></span></div>`;

function viewResult() {
  const s = S.sess, it = cur(), an = analyze(it.text, it.dur, it.ref.v);
  const pace = an.wpm == null ? ['', ''] : an.wpm < 110 ? ['warn', '偏慢，試著減少停頓'] : an.wpm > 160 ? ['warn', '偏快，注意清晰度'] : ['ok', '語速適中'];
  const len = it.kind === 'p2' ? (it.dur < 60 ? ['warn', '偏短，目標 1 分半以上'] : it.dur < 90 ? ['', '可以再多講一點'] : ['ok', '長度足夠']) : (it.dur < 20 ? ['warn', '偏短，補上原因和例子'] : ['ok', '長度足夠']);
  let nav;
  if (s.mode === 'A' && it.kind === 'p2') nav = `<button class="btn primary big" data-act="toP3">繼續 Part 3 →</button><button class="btn" data-act="redo">重答這題</button><button class="btn ghost" data-act="startA">換下一張題卡</button>`;
  else if (s.mode === 'A') nav = `<button class="btn primary big" data-act="toP3">${s.pos >= 3 ? '看本次總結 →' : '下一題 →'}</button><button class="btn" data-act="redo">重答這題</button>`;
  else nav = `<button class="btn primary big" data-act="nextB">下一題 →</button><button class="btn" data-act="redo">重答這題</button><button class="btn ghost" data-act="finish">結束練習</button>`;

  const body = S.editing
    ? `<textarea class="en" id="editBox" rows="8" placeholder="在這裡輸入或修正你說的內容">${esc(it.text)}</textarea><div class="actions" style="margin-top:10px"><button class="btn primary sm" data-act="saveEdit">完成</button>${it.text ? '<button class="btn ghost sm" data-act="cancelEdit">取消</button>' : ''}</div>`
    : `<div class="tscript" lang="en">${an.html}</div>${LEGEND}`;
  const empty = !it.text && !S.manual ? `<div class="banner warn" style="margin-bottom:12px">這次沒有辨識到內容。請確認麥克風有收到聲音、說的是英文，並使用 Chrome 或 Edge。也可以直接在下面輸入你說的內容。</div>` : '';

  const vocabCard = `<section class="card"><div class="card-h"><h3>本題加分詞彙</h3><span class="count">用了 ${an.usedN} / ${it.ref.v.length}</span></div>
    <div class="chips">${it.ref.v.map((v, i) => `<span class="chip${an.used[i] ? ' on' : ''}" lang="en" title="${esc(v[2])}">${esc(v[0])}</span>`).join('')}</div>
    <p class="fine" style="margin-top:10px">${an.usedN ? '綠色是你這次用出來的。灰色的下次挑一兩個試試。' : '這次還沒用到。重答時挑一兩個放進去，比一次全用更自然。'}</p></section>`;
  const toolCard = `<section class="card"><div class="card-h"><h3>用到的工具箱表達</h3><span class="count">${an.tools.length} 個</span></div>
    ${an.tools.length ? `<div class="chips">${an.tools.map(t => `<span class="chip tool" lang="en" title="${esc(t.title)}">${esc(t.p)}</span>`).join('')}</div>` : '<p class="fine">這次沒有用到。下一題試著放進一兩個，例如 That said、In my case、which means。</p>'}
    <div class="actions" style="margin-top:12px"><button class="btn sm" data-act="tool">打開表達工具箱</button></div></section>`;
  const fl = (arr) => arr.map(([w, c]) => `<b lang="en">${esc(w)}</b> ×${c}`).join('、');
  const habitCard = `<section class="card"><div class="card-h"><h3>口頭習慣</h3></div>
    ${an.shallow.length ? an.shallow.map(x => `<div class="shrow"><span class="w" lang="en">${esc(x.label)}<small>×${x.c}</small></span><span class="alts">可以換成 ${x.alt.map(a => `<b lang="en">${esc(a)}</b>`).join('、')}</span><button class="btn sm" data-act="tool" data-cat="${x.cat}">更多說法</button></div>`).join('') : '<p class="fine">沒有哪個字用得特別多，很好。</p>'}
    ${an.strongN ? `<p style="margin-top:12px;font-size:14.5px">贅字：${fl(an.strong)}</p>` : ''}
    ${an.softN ? `<p style="margin-top:6px;font-size:14.5px">口頭禪：${fl(an.soft)} <span class="fine">（不一定是缺點，留意頻率就好）</span></p>` : ''}
    <p class="fine" style="margin-top:10px">Chrome 常會自動濾掉 um、uh，所以實際的贅字可能比這裡多。</p></section>`;

  return `<div class="stack">${itemBlock(it, true)}
    <div class="stats">
      <div class="stat"><b>${an.n}</b><span>字數</span></div>
      <div class="stat"><b>${fmt(it.dur)}</b><span>時長</span><em class="${len[0]}">${len[1]}</em></div>
      <div class="stat"><b>${an.wpm == null ? '—' : an.wpm}</b><span>語速（每分鐘字數）</span><em class="${pace[0]}">${pace[1]}</em></div>
      <div class="stat"><b>${an.strongN}</b><span>贅字</span>${an.softN ? `<em>另有口頭禪 ${an.softN} 次</em>` : ''}</div>
    </div>
    <section class="card"><div class="card-h"><h3>你說了什麼</h3>${S.editing ? '' : '<div class="actions"><button class="btn sm" data-act="edit">修正逐字稿</button><button class="btn sm" data-act="copy">複製</button></div>'}</div>
      ${empty}${body}
      <p class="fine" style="margin-top:10px">逐字稿由瀏覽器辨識，可能和你實際說的有落差。被聽錯的字，常常就是發音不夠清楚的字，值得留意。</p></section>
    ${S.editing ? '' : vocabCard + toolCard + habitCard}
    ${hintsHTML(it.ref, it.kind, true)}
    <div class="actions">${nav}</div></div>`;
}

function viewSummary() {
  const s = S.sess, done = s.items.filter(answered);
  let W = 0, D = 0, Fn = 0, V = 0, VM = 0;
  const rows = done.map(it => { const an = analyze(it.text, it.dur, it.ref.v); W += an.n; D += it.dur; Fn += an.strongN; V += an.usedN; VM += it.ref.v.length; return `<div class="sumrow"><span class="qq" lang="en">${esc(it.ref.t)}</span><span class="nums">${miniStats(an, it.dur)} · 詞彙 ${an.usedN}/${it.ref.v.length}</span></div>`; }).join('');
  return `<div class="stack">
    <section class="hero" style="padding-top:4px"><h1>${done.length ? '這次練完了' : '這次沒有完成任何題目'}</h1><p class="lead">${done.length ? '紀錄已經存到「歷史」，之後可以回來看每一題的逐字稿。' : '沒關係，隨時可以再開始。'}</p></section>
    ${done.length ? `<div class="stats">
      <div class="stat"><b>${done.length}</b><span>完成題數</span></div>
      <div class="stat"><b>${W}</b><span>總字數</span></div>
      <div class="stat"><b>${D >= 5 && W ? Math.round(W / (D / 60)) : '—'}</b><span>平均語速</span></div>
      <div class="stat"><b>${V}/${VM}</b><span>加分詞彙</span></div></div>
    <section class="card">${rows}</section>` : ''}
    <div class="actions">${s.mode === 'A' ? '<button class="btn primary big" data-act="startA">再練一張題卡</button>' : '<button class="btn primary big" data-act="startB">繼續練 Part 3</button>'}<button class="btn" data-act="nav" data-to="history">看歷史紀錄</button><button class="btn ghost" data-act="nav" data-to="home">回首頁</button></div></div>`;
}

function toolCatHTML(c, prefix, open) {
  return `<details class="tcat" id="${prefix}-${c.id}"${open ? ' open' : ''}><summary><b>${esc(c.title)}</b><small>${esc(c.when)}</small></summary><div class="tbody">
    ${c.weak.length ? `<p class="weak">別只說：${c.weak.map(w => `<span lang="en">${esc(w)}</span>`).join('')}</p>` : ''}
    <div class="vlist">${c.items.map(it => `<div class="vrow"><div><b lang="en">${esc(it[0])}</b> <span class="zh">${esc(it[1])}</span><div class="ex" lang="en">${esc(it[2])}</div></div>${starBtn(lexKey(cleanP(it[0])))}</div>`).join('')}</div>
    <p class="tip">${esc(c.tip)}</p></div></details>`;
}
function viewToolbox() {
  return `<div class="stack">
  <section class="hero" style="padding-top:4px"><p class="eyebrow">表達工具箱</p><h1>遇到什麼情況，可以怎麼說</h1><p class="lead">不分題目都能用的口說表達，依情境整理。先看懂評分要什麼，再挑幾個放進自己的回答。</p></section>
  <section class="card guide"><h3>7.0 到 7.5 的回答需要什麼</h3><ul>
    <li><b>流暢與連貫：</b>能不費力地講出長段落，並靈活使用口語的連接與銜接語。對應下方的補充、原因、結果、轉折、敘事銜接。</li>
    <li><b>詞彙：</b>用得出一些較少見的說法和慣用語，搭配詞用對，忘字時能換句話說。對應每題的加分詞彙和「換句話說」。</li>
    <li><b>文法：</b>能混用複雜句，例如條件句、關係子句、完成式，而且多數句子沒有錯。對應「假設與推測」。</li>
    <li><b>發音：</b>清楚、有語調起伏。這個工具無法評分，但逐字稿裡被聽錯的字可以當作線索。</li>
    <li><b>7.0 和 7.5 的差別</b>不在於用更難的字，而在於用得更準、更自然，搭配錯誤更少。</li>
  </ul></section>
  <section class="card guide"><h3>三個常見的扣分習慣</h3><ul>
    <li><b>背稿。</b>考官聽得出來。準備「想法和詞彙」，不要準備整段稿子。</li>
    <li><b>把寫作連接詞搬到口說。</b>Moreover、Furthermore、In conclusion 在對話裡很不自然，請用下方的口語版本。</li>
    <li><b>硬塞成語和難字。</b>用錯語境會扣分。一題用一個確定會用的，比塞三個不確定的好。</li>
  </ul></section>
  <section class="card guide"><h3>回答架構</h3>
    <p><b>Part 2（講滿 2 分鐘）</b></p><div class="flow"><span>開場點題</span><i>→</i><span>依題卡要點講細節</span><i>→</i><span>一個具體場景</span><i>→</i><span>感受與反思</span></div>
    <p style="margin-top:14px"><b>Part 3（每題 30 到 60 秒）</b></p><div class="flow"><span>觀點</span><i>→</i><span>原因</span><i>→</i><span>例子</span><i>→</i><span>延伸或讓步</span></div>
    <div class="demo" lang="en"><i>Are people too dependent on technology?</i><br>To a large extent, yes.<mark>觀點</mark> The main reason is that we've handed over so many everyday tasks to our phones.<mark>原因</mark> In my case, I can't even remember my best friend's number.<mark>例子</mark> That said, I don't think it's entirely a bad thing, since it frees up our attention for other things.<mark>讓步</mark></div>
  </section>
  <section class="card guide"><h3>讓回答有深度的五個方向</h3><ul>
    <li><b>過去與現在：</b>這件事以前是怎樣，現在有什麼不同？</li>
    <li><b>個人與社會：</b>對我來說是這樣，對整個社會呢？</li>
    <li><b>利與弊：</b>好處之外，有沒有代價？</li>
    <li><b>原因與影響：</b>為什麼會這樣？接下來會導致什麼？</li>
    <li><b>假設情境：</b>如果情況相反，會發生什麼事？</li>
  </ul><p class="fine" style="margin-top:10px">回答卡住時，從這五個方向挑一個問自己，通常就能多講兩三句。</p></section>
  <h3 class="sec" style="margin-top:28px">依情境查表達</h3>
  ${TOOLBOX.map(c => toolCatHTML(c, 'p')).join('')}
  </div>`;
}

function vocabListHTML() {
  const q = S.vq.trim().toLowerCase();
  const all = store.get(K.vocab, []);
  const list = q ? all.filter(v => v.w.toLowerCase().includes(q) || v.zh.includes(q)) : all;
  if (!all.length) return '<div class="empty">還沒有收藏的單字。<br>在「學習提示」或「工具箱」裡點 ☆，就會出現在這裡。</div>';
  if (!list.length) return '<div class="empty">找不到符合的單字。</div>';
  return `<section class="card"><div class="vlist">${list.map(v => vrow([v.w, v.pos, v.zh, v.ex], v.src)).join('')}</div></section>`;
}
function viewVocab() {
  const n = store.get(K.vocab, []).length;
  return `<div class="stack">
  <section class="hero" style="padding-top:4px"><p class="eyebrow">單字本</p><h1>我收藏的詞彙 <span class="fine">${n} 個</span></h1></section>
  <div class="tools-row"><input type="search" id="vq" placeholder="搜尋英文或中文" value="${esc(S.vq)}" aria-label="搜尋單字"><button class="btn sm" data-act="toggleZh">${S.hideZh ? '顯示中文' : '遮住中文自我測驗'}</button></div>
  <div id="vlist" class="${S.hideZh ? 'hide-zh' : ''}">${vocabListHTML()}</div>
  ${S.hideZh ? '<p class="fine">點一下灰色區塊可以看答案。</p>' : ''}</div>`;
}

function viewHistory() {
  const h = store.get(K.hist, []);
  const date = ts => new Date(ts).toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `<div class="stack">
  <section class="hero" style="padding-top:4px"><p class="eyebrow">歷史紀錄</p><h1>我練過的題目 <span class="fine">${h.length} 筆</span></h1></section>
  ${h.length ? h.map(rec => `<details class="hist"><summary><span><span class="meta">${date(rec.ts)} · ${rec.mode === 'A' ? '模式 A' : '模式 B'} · ${rec.items.length} 題</span><span class="ttl" lang="en">${esc(rec.mode === 'A' ? rec.title : rec.items[0].q)}</span></span></summary><div class="hist-body">
      ${rec.items.map(it => { const ref = it.kind === 'p2' ? CARD[it.rid] : Q3[it.rid]; const an = analyze(it.text, it.dur, ref ? ref.v : []); return `<div class="hitem"><h4 lang="en">${it.kind === 'p2' ? 'Part 2' : 'Part 3'}：${esc(it.q)}</h4><div class="mini">${miniStats(an, it.dur)}${ref ? ` · 詞彙 ${an.usedN}/${ref.v.length}` : ''}</div><div class="tscript${it.text ? '' : ' empty'}" lang="en">${it.text ? an.html : '（沒有內容）'}</div></div>`; }).join('')}
      <div class="actions"><button class="btn sm danger" data-act="delHist" data-id="${esc(rec.id)}">刪除這筆</button></div></div></details>`).join('')
      + '<div class="actions"><button class="btn ghost sm danger" data-act="clearHist">清除全部紀錄</button></div>'
      : '<div class="empty">還沒有練習紀錄。<br>完成一題之後，題目和逐字稿會自動存在這裡。</div>'}</div>`;
}

function render() {
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.to === S.view || (S.view === 'practice' && b.dataset.to === 'home')));
  const v = S.view;
  $('#app').innerHTML = v === 'home' ? viewHome() : v === 'practice' ? viewPractice() : v === 'toolbox' ? viewToolbox() : v === 'vocab' ? viewVocab() : viewHistory();
  $('#fab').hidden = v !== 'practice';
  window.scrollTo(0, 0);
}

/* ================= 抽屜、提示訊息 ================= */
function openDrawer(cat) {
  const b = $('#drawerBody');
  b.innerHTML = TOOLBOX.map(c => toolCatHTML(c, 'd', c.id === cat)).join('');
  $('#drawer').hidden = false; $('#scrim').hidden = false;
  const el = cat && $('#d-' + cat); if (el) el.scrollIntoView({ block: 'start' }); else b.scrollTop = 0;
}
function closeDrawer() { $('#drawer').hidden = true; $('#scrim').hidden = true; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function copyText(text) {
  const done = () => toast('已複製逐字稿');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗，請手動選取文字'); } ta.remove(); }
}

/* ================= 事件 ================= */
const ACT = {
  nav(el) { stopAll(); closeDrawer(); S.view = el.dataset.to; S.stage = null; render(); },
  quit() {
    stopAll();
    if (S.stage !== 'summary' && S.sess && S.sess.items.some(answered)) { S.stage = 'summary'; render(); return; }
    S.view = 'home'; S.stage = null; render();
  },
  startA, startB, nextB, toP3,
  prep: goPrep,
  speakNow() { warmMic(); goSpeak(); },
  stop: recStop,
  retryRec() { goSpeak(); },
  manualRec() { goSpeak(true); },
  useKept() { R.on = false; finish(); },
  swapQ() { S.sess.items.pop(); nextB(); },
  redo() { const it = cur(); it.done = false; goSpeak(); },
  finish() { S.stage = 'summary'; render(); },
  edit() { S.editing = true; render(); const b = $('#editBox'); if (b) b.focus(); },
  cancelEdit() { S.editing = false; render(); },
  saveEdit() { const it = cur(); it.text = $('#editBox').value.trim(); S.editing = false; commitItem(it); render(); },
  copy() { copyText(cur().text); },
  tool(el) { openDrawer(el.dataset.cat); },
  closeDrawer,
  star(el) {
    const k = el.dataset.k, on = toggleStar(k);
    if (S.view === 'vocab' && !$('#drawer').contains(el)) { render(); return; }
    $$('.star').filter(b => b.dataset.k === k).forEach(b => { b.classList.toggle('on', on); b.textContent = on ? '★' : '☆'; b.setAttribute('aria-pressed', on); b.title = on ? '取消收藏' : '收藏到單字本'; b.setAttribute('aria-label', b.title); });
    toast(on ? '已收藏到單字本' : '已取消收藏');
  },
  toggleZh() { S.hideZh = !S.hideZh; render(); },
  delHist(el) { store.set(K.hist, store.get(K.hist, []).filter(r => r.id !== el.dataset.id)); render(); toast('已刪除'); },
  clearHist() { if (confirm('確定要清除全部歷史紀錄嗎？這個動作無法復原。')) { store.set(K.hist, []); render(); } },
  resetSeen() { if (confirm('確定要重置題庫進度嗎？回答過的題目會重新出現。')) { store.set(K.seen2, []); store.set(K.seen3, []); SHOWN[K.seen2].clear(); SHOWN[K.seen3].clear(); render(); toast('題庫進度已重置'); } }
};
document.addEventListener('click', e => {
  const zh = e.target.closest('.hide-zh .zh'); if (zh) { zh.classList.toggle('show'); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { if (el.closest('summary')) e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => { if (e.target.id === 'vq') { S.vq = e.target.value; $('#vlist').innerHTML = vocabListHTML(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

render();
</script>
</body>
</html>
